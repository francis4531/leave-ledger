<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Leave Ledger Tests</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d5d79'/%3E%3Crect x='3' y='3' width='2.5' height='10' rx='.8' fill='white'/%3E%3Crect x='6.75' y='6' width='2.5' height='7' rx='.8' fill='white' opacity='.75'/%3E%3Crect x='10.5' y='9' width='2.5' height='4' rx='.8' fill='white' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Tests page: latest deploy, what is covered, deploy history, Clerk accuracy over time. Admin only. */
:root{
  color-scheme:light;
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#15202b; --muted:#5a6876; --line:#d9e0e7;
  --accent:#0d5d79; --accent-ink:#ffffff; --accent-soft:#e0edf2;
  --poppy:#d9581a; --poppy-soft:#fbe7dc;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6510; --warn-soft:#fbefd6; --bad:#b83a27; --bad-soft:#f8e1dc;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand{color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:800}
.brand > span > span{display:block;font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;font:inherit;font-weight:600;font-size:.88rem;text-decoration:none;cursor:pointer}
main.wrap{padding-block:26px 60px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:1.75rem;font-weight:800}
.hero p{color:var(--muted);margin:6px 0 0;max-width:70ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:0}
.big small{font-size:.95rem;color:var(--muted);font-weight:600}
.stat .note{font-size:.84rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;min-width:0}
.panel h2{font-size:1.15rem;font-weight:700}
.panel .sub{color:var(--muted);margin:4px 0 14px;font-size:.92rem;max-width:72ch}
.banner{border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner b{font-family:var(--f-display);font-size:1.05rem}
.banner p{margin:2px 0 0;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px;background:var(--ok)}
.bad .dot{background:var(--bad)} .warn .dot{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
details.area{border-top:1px solid var(--line)}
details.area:first-of-type{border-top:0}
details.area summary{cursor:pointer;padding:11px 2px;display:flex;gap:10px;align-items:center;list-style:none}
details.area summary::-webkit-details-marker{display:none}
details.area summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.area[open] summary::before{transform:rotate(45deg)}
details.area summary b{margin-right:auto;font-weight:600}
.what{font-size:.86rem;color:var(--muted);margin:0 0 8px 18px;max-width:72ch}
.group{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:12px 0 4px 18px}
ul.tl{list-style:none;margin:0 0 10px 18px;padding:0}
ul.tl li{display:flex;gap:8px;padding:3px 0;font-size:.9rem;align-items:baseline}
ul.tl li .mk{flex:none;width:14px;font-weight:700;color:var(--ok)}
ul.tl li.f .mk{color:var(--bad)}
ul.tl li .ms{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.err{color:var(--bad);font-size:.84rem;white-space:pre-wrap;margin:2px 0 6px 22px;font-family:ui-monospace,Menlo,monospace}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filter input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 10px;font:inherit}
.chart{width:100%;min-width:560px;height:auto;display:block}
.scroll table{min-width:560px}
td.w{white-space:nowrap}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.next{font-size:.9rem;color:var(--muted)}
.msg{max-width:560px;margin:80px auto;padding:0 16px;text-align:center}
.msg .sub{color:var(--muted)}
.foot{color:var(--muted);font-size:.84rem}
code{font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/inbox"><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="3" height="12" rx="1" fill="var(--accent-ink)"/><rect x="6.5" y="5" width="3" height="9" rx="1" fill="var(--accent-ink)" opacity=".75"/><rect x="11" y="8" width="3" height="6" rx="1" fill="var(--accent-ink)" opacity=".5"/></svg></span><span><b>Leave Ledger</b><span>Tests</span></span></a>
  <a class="btn" href="/strategy">Strategy</a>
  <a class="btn" href="/inbox">Back to the inbox</a>
</div></header>
<div id="root"><p class="msg">Loading</p></div>
<script>
// What each area of tests protects, in plain words.
const WHAT = {
  "Leave rules (answer key)": "The 85 hand-written cases that say what the law requires: who qualifies for CFRA, FMLA, PDL and the rest, how many weeks, what the state pays, and when each notice is due. If the rules engine gives a different answer from the key, the deploy stops.",
  "City sick leave": "The local sick leave rules for the largest California cities, on top of the state minimum.",
  "Access, privacy and security": "Who can see what. Sign-in, tampered cookies, other sites, managers never seeing reasons, employees seeing only their own leave, workspaces kept apart, the sandbox, export and delete, admin pages hidden from everyone else.",
  "Letters and notices": "The letters Leave Ledger drafts: the right dates, the right law, and nothing medical where it does not belong.",
  "Employee import and manager notice": "Bringing employees in from a file: matching columns, catching bad rows, and the approval email to the manager carrying dates only.",
  "Guide and state pay steps": "The Guide tab and the EDD steps an employee follows to get paid by the state.",
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" }) : "";
const day = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "America/Los_Angeles" });
const secs = (ms) => ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : ms + " ms";
const root = document.getElementById("root");

function latest(cur) {
  if (!cur) return `<div class="banner warn"><span class="dot"></span><div><b>No results saved for this deploy</b><p>The build ran the tests the old way. The next deploy saves them here.</p></div></div>`;
  const bad = cur.failed > 0, b = cur.build ? `Build ${cur.build}` : "This build";
  const failing = cur.tests.filter((t) => !t.ok);
  return `<div class="banner ${bad ? "bad" : "ok"}"><span class="dot"></span><div><b>${bad ? `${cur.failed} test${cur.failed > 1 ? "s" : ""} failed` : `All ${cur.passed} tests passed`}</b><p>${b}${cur.sha ? ` (${esc(cur.sha)})` : ""}, ${when(cur.at)} Pacific. ${bad ? "Netlify stopped this deploy, so the last good version is still live." : "Only a build where every test passes goes live."}</p></div></div>
  <div class="stats">
    <div class="stat"><span class="label">Passed</span><span class="big">${cur.passed}</span></div>
    <div class="stat"><span class="label">Failed</span><span class="big" style="${bad ? "color:var(--bad)" : ""}">${cur.failed}</span></div>
    <div class="stat"><span class="label">Areas</span><span class="big">${new Set(cur.tests.map((t) => t.area)).size}</span></div>
    <div class="stat"><span class="label">Run time</span><span class="big">${(cur.ms / 1000).toFixed(1)}<small> s</small></span></div>
  </div>
  ${failing.length ? `<section class="panel"><h2>What failed</h2><ul class="tl">${failing.map((t) => `<li class="f"><span class="mk">✕</span><span><b>${esc(t.area)}</b>: ${esc(t.name)}</span></li>${t.error ? `<div class="err">${esc(t.error)}</div>` : ""}`).join("")}</ul></section>` : ""}`;
}

function coverage(cur) {
  if (!cur) return "";
  const areas = {};
  for (const t of cur.tests) (areas[t.area] ||= []).push(t);
  const order = Object.keys(WHAT).filter((a) => areas[a]).concat(Object.keys(areas).filter((a) => !WHAT[a]));
  return `<section class="panel"><h2>What is covered</h2><p class="sub">Every test that runs on each deploy, by part of the product. Open an area to see each test in its own words.</p>
  <div class="filter"><input id="q" type="search" placeholder="Find a test, for example CFRA or manager" aria-label="Find a test"></div>
  <div id="areas">${order.map((a) => {
    const list = areas[a], f = list.filter((t) => !t.ok).length, groups = {};
    for (const t of list) (groups[t.group || ""] ||= []).push(t);
    return `<details class="area"${f ? " open" : ""} data-area><summary><b>${esc(a)}</b><span class="pill ${f ? "bad" : "ok"}">${f ? `${f} failed` : `${list.length} passed`}</span></summary>
      ${WHAT[a] ? `<p class="what">${esc(WHAT[a])}</p>` : ""}
      ${Object.entries(groups).map(([g, ts]) => `${g ? `<div class="group">${esc(g.replace(/^[^:]+:\s*/, ""))}</div>` : ""}<ul class="tl">${ts.map((t) => `<li class="${t.ok ? "" : "f"}" data-t="${esc((a + " " + g + " " + t.name).toLowerCase())}"><span class="mk">${t.ok ? "✓" : "✕"}</span><span>${esc(t.name)}</span><span class="ms">${secs(t.ms)}</span></li>`).join("")}</ul>`).join("")}
    </details>`;
  }).join("")}</div>
  <p class="foot" style="margin-top:12px">Plus 14 click-through tests that drive the real app in a browser before each commit. Their results move onto this page next.</p></section>`;
}

function history(deploys) {
  if (!deploys.length) return "";
  return `<section class="panel"><h2>Deploy history</h2><p class="sub">The last ${deploys.length === 1 ? "deploy" : deploys.length + " deploys"}, newest first, up to 30. Each row is added the first time this page opens on that deploy.</p>
  <div class="scroll"><table><thead><tr><th>Build</th><th>When</th><th>Result</th><th class="n">Passed</th><th class="n">Failed</th><th class="n">Run time</th></tr></thead><tbody>
  ${deploys.map((d) => `<tr><td>${d.build ? esc(d.build) : "?"}${d.sha ? ` <span style="color:var(--muted)">${esc(d.sha)}</span>` : ""}</td><td class="w">${when(d.at)}</td><td><span class="pill ${d.failed ? "bad" : "ok"}">${d.failed ? "Stopped" : "Passed"}</span>${d.failed ? `<div style="font-size:.82rem;color:var(--muted);margin-top:2px">${Object.entries(d.areas || {}).filter(([, v]) => v.failed).map(([k, v]) => `${esc(k)}: ${v.failed}`).join(", ")}</div>` : ""}</td><td class="n">${d.passed}</td><td class="n">${d.failed}</td><td class="n">${secs(d.ms)}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

// Clerk accuracy over time: one line for the share of requests read fully right, one for reasons, against the 90% bar.
function clerk(runs, bar, golden) {
  const pts = [...runs].reverse();
  const head = `<section class="panel"><h2>Clerk accuracy over time</h2><p class="sub">Each run checks Clerk against the ${golden} written leave requests with known answers, including the tricky ones. Clerk stays on only while it reads at least ${bar}% of requests fully right. Start a run from the inbox.</p>`;
  if (!pts.length) return head + `<p class="next">No runs yet.</p></section>`;
  const W = 720, H = 240, L = 40, R = 16, T = 14, B = 30, lo = Math.min(60, ...pts.map((p) => Math.min(p.rowsPct, p.reasonPct))) - 5;
  const x = (i) => pts.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1);
  const y = (v) => T + ((100 - v) * (H - T - B)) / (100 - lo);
  const ticks = [100, 90, 80, 70, 60, 50].filter((v) => v >= lo);
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${pts.map((p, i) => `${x(i)},${y(p[k])}`).join(" ")}"/>` + pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k])}" r="3.5" fill="${c}"><title>${day(p.at)}: ${p[k]}%</title></circle>`).join("");
  const every = Math.max(1, Math.ceil(pts.length / 8));
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clerk accuracy per run against the ${bar}% bar">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${y(bar)}" y2="${y(bar)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${y(bar) - 5}" text-anchor="end" style="fill:var(--bad)">${bar}% bar</text>
    ${line("reasonPct", "var(--muted)")}${line("rowsPct", "var(--accent)")}
    ${pts.map((p, i) => i % every === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${day(p.at)}</text>` : "").join("")}
  </svg>`;
  const last = runs[0];
  return head + `<div class="scroll">${svg}</div>` + `<div class="legend"><span><i style="background:var(--accent)"></i>Requests read fully right</span><span><i style="background:var(--muted)"></i>Reason right</span><span><i style="background:var(--bad);height:2px"></i>${bar}% bar</span></div>
  <div class="scroll" style="margin-top:14px"><table><thead><tr><th>Run</th><th class="n">Fully right</th><th class="n">Reason right</th><th class="n">Tricky cases</th><th class="n">Misses</th><th class="n">Avg time</th></tr></thead><tbody>
  ${runs.slice(0, 10).map((r) => `<tr><td class="w">${when(r.at)}</td><td class="n" style="${r.rowsPct < bar ? "color:var(--bad);font-weight:700" : ""}">${r.rowsPct}%</td><td class="n">${r.reasonPct}%</td><td class="n">${r.adversarialPct}%</td><td class="n">${r.misses}</td><td class="n">${secs(r.avgMs)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="foot" style="margin-top:10px">Latest: ${last.rowsPct}% fully right, ${last.rowsPct >= bar ? "above" : "below"} the bar.</p></section>`;
}

async function load() {
  let r;
  try { r = await fetch("/api/tests", { credentials: "same-origin" }); } catch (e) { root.innerHTML = `<div class="msg"><h1>Can't reach the site</h1><p class="sub">Check your connection and reload.</p></div>`; return; }
  if (!r.ok) { root.innerHTML = `<div class="msg"><h1>Page not found</h1><a class="btn" href="/">Go to the app</a></div>`; return; }
  const d = await r.json();
  root.innerHTML = `<main class="wrap">
    <div class="hero"><h1>Tests</h1><p>Every deploy runs these tests first. If one fails, the deploy stops and the last good version stays live.</p></div>
    ${latest(d.current)}${coverage(d.current)}${clerk(d.clerk || [], d.clerkBar, d.golden)}${history(d.history || [])}
    <p class="foot">Visible only to the site admin, signed in as ${esc(d.viewer)}.</p></main>`;
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    document.querySelectorAll("[data-area]").forEach((a) => {
      let n = 0; a.querySelectorAll("li[data-t]").forEach((li) => { const hit = !v || li.dataset.t.includes(v); li.hidden = !hit; n += hit; });
      a.hidden = !n; if (v) a.open = n > 0;
    });
  });
}
load();
</script>
</body>
</html>
