<style>:root{color-scheme:light}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
.foot a{color:var(--accent)}
/* Clerk */
.copilot{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface));border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}

.cp-note{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.9rem}
.cp-note.warn{border-color:var(--warn);background:var(--warn-soft)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field.needs-check label{color:var(--warn)}
.field.needs-check label::after{content:" · please check";font-weight:500}
.field.needs-check select,.field.needs-check input{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.quote{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 6px 6px 0;font-size:.95rem}
.err{color:var(--bad);font-size:.88rem;font-weight:600;margin:0}
/* Feedback mode */
.fb-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.fb-pop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:31;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.fb-pop textarea{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale .chip{min-width:40px;text-align:center}
.scale-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);max-width:260px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:12px 14px}
.survey{max-width:720px;margin:0 auto;width:100%}
.survey .q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.survey .q b{font-size:.98rem}
.note-box{font-size:.86rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:10px 12px}
.gbtn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:9px 14px;border-radius:6px;font-weight:600;width:max-content}
.gbtn:hover{border-color:var(--accent)}
.gbar{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.acct.space[disabled]{opacity:.55;cursor:not-allowed}
.login a{color:var(--accent)}
select[data-emp$="|mgr"]{min-width:130px}
input[type=date]{min-width:0}
@media print{.fb-btn,.fb-pop{display:none}}

<style>
/* Layout: sticky app bar with role switch, tabbed workspace below; summary rail first, detail second, stacks to one column on phones. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#15202b; --muted:#5a6876; --line:#d9e0e7;
  --accent:#0d5d79; --accent-ink:#ffffff; --accent-soft:#e0edf2;
  --poppy:#d9581a; --poppy-soft:#fbe7dc;
  --cfra:#0d5d79; --fmla:#7b8a99; --pdl:#d9581a; --short:#6a57a8;
  --sdi:#2e8478; --pfl:#5d9a3c; --unpaid:#b9c3cc;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6510; --warn-soft:#fbefd6; --bad:#b83a27; --bad-soft:#f8e1dc;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --cfra:#5fb4d3; --fmla:#8d9cab; --pdl:#f0884c; --short:#a593e0;
  --sdi:#4fb3a5; --pfl:#8cc46a; --unpaid:#3e4b57;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --cfra:#5fb4d3; --fmla:#8d9cab; --pdl:#f0884c; --short:#a593e0;
  --sdi:#4fb3a5; --pfl:#8cc46a; --unpaid:#3e4b57;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1220px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.mark svg{display:block}
.brand b{font-family:var(--f-display);font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.co{font-size:.82rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;line-height:18px;text-align:center}

main{max-width:1220px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);max-width:70ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid2.form{grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media (max-width:900px){.grid2,.grid2.even,.grid2.form{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* Law coverage strip */
.laws{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.law{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.law .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.law .dot{width:8px;height:8px;border-radius:50%}
.law.off{background:var(--sunk);color:var(--muted)}
.law .why{font-size:.8rem;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.alert .n{color:var(--bad)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.poppy{background:var(--poppy-soft);color:var(--poppy)}

/* Task queue */
.queue{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.qrow .t{font-weight:600}
.qrow .s{font-size:.84rem;color:var(--muted)}
.qrow.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.linkish:hover{text-decoration:underline}
.req{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--poppy);margin-left:6px}

/* Tables */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:.86rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 140px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.97)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Eligibility checks */
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.chk i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;flex:none;margin-top:1px}
.chk.y i{background:var(--ok-soft);color:var(--ok)}
.chk.n i{background:var(--bad-soft);color:var(--bad)}
.elig{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.elig > div{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:6px}
.tl-axis{position:relative;height:18px;margin-left:110px;font-size:.74rem;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-axis span:first-child{transform:none}
.lane{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center}
.lane .ln{font-size:.76rem;font-weight:600;color:var(--muted);text-align:right}
.track{position:relative;height:30px;background:var(--sunk);border-radius:4px;overflow:hidden}
.sg{position:absolute;top:3px;bottom:3px;border-radius:3px;color:#fff;font-size:.72rem;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.sg.pdl{background:var(--pdl)} .sg.cfra{background:var(--cfra);color:var(--accent-ink)} .sg.fmla{background:repeating-linear-gradient(135deg,var(--fmla) 0 6px,color-mix(in srgb,var(--fmla) 75%,var(--surface)) 6px 12px)}
.sg.short{background:var(--short)} .sg.sdi{background:var(--sdi)} .sg.pfl{background:var(--pfl)}
.sg.none{background:repeating-linear-gradient(135deg,var(--bad) 0 5px,transparent 5px 10px);color:var(--bad);border:1px solid var(--bad)}
.sg.unpaid,.sg.wait{background:repeating-linear-gradient(135deg,var(--unpaid) 0 5px,transparent 5px 10px);color:var(--ink);border:1px solid var(--unpaid)}
.sg.sick{background:var(--sdi)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.seglist{display:flex;flex-direction:column}
.seglist div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:.88rem}
.seglist div:first-child{border-top:0}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.notes{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.note{display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.cite{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.warnbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.9rem}
.warnbox.bad{border-color:var(--bad);background:var(--bad-soft)}
.infobox{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:.86rem;color:var(--muted)}

/* Team calendar */
.cal{display:flex;flex-direction:column;gap:6px;min-width:620px}
.cal .lane{grid-template-columns:150px minmax(0,1fr)}
.cal .ln{text-align:left;color:var(--ink);font-size:.86rem}
.cal .tl-axis{margin-left:160px}
.calw{overflow-x:auto}
.wk{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

.balance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.balance > div{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:3px}
.balance .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;counter-increment:st;font-size:.92rem}
.steps li::before{content:counter(st);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

/* Sign-in */
.login{max-width:980px;margin:0 auto;padding-block:40px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}}
.login h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.login .lede{color:var(--muted);max-width:44ch}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.acct{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.acct:hover{border-color:var(--accent)}
.acct[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.acct b{font-size:.92rem}
.acct span{font-size:.8rem;color:var(--muted)}
.acct .em{font-family:var(--f-mono);font-size:.72rem}
.grp{display:flex;flex-direction:column;gap:8px}
.err{color:var(--bad);font-size:.88rem;font-weight:600}
.envtag{white-space:nowrap;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px}
.who{display:flex;align-items:center;gap:10px;font-size:.84rem}
.who .nm{font-weight:600}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
/* ---------- Friendlier pass ---------- */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.74rem;flex:none;letter-spacing:.02em}
.av.sm{width:26px;height:26px;font-size:.66rem}
.av.lg{width:44px;height:44px;font-size:.95rem}
.av.c0{background:color-mix(in srgb,var(--cfra) 18%,var(--surface));color:var(--cfra)}
.av.c1{background:color-mix(in srgb,var(--pdl) 18%,var(--surface));color:var(--pdl)}
.av.c2{background:color-mix(in srgb,var(--short) 18%,var(--surface));color:var(--short)}
.av.c3{background:color-mix(in srgb,var(--sdi) 20%,var(--surface));color:var(--sdi)}
.av.c4{background:color-mix(in srgb,var(--pfl) 22%,var(--surface));color:var(--pfl)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person > div{min-width:0}
.who{gap:10px}
.who .meta{display:flex;flex-direction:column;line-height:1.25}
.who .meta .r{font-size:.78rem;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:.84rem}
@media (max-width:640px){.who .meta,.who .av{display:none}.bar-in{flex-wrap:nowrap}.brand{min-width:0;flex:1 1 auto}.brand > div{min-width:0}.co{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.who .btn{white-space:nowrap}
.tabs .push{margin-left:auto}
h2.greet{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.sumline{font-size:1rem;color:var(--ink);max-width:70ch}
.sumline b{font-weight:700}
.sumline .bad{color:var(--bad)}
.qgroup{display:flex;flex-direction:column;gap:2px}
.qgroup + .qgroup{margin-top:10px}
.qhead{display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.qhead .dot{width:8px;height:8px;border-radius:50%}
.qrow{grid-template-columns:22px minmax(0,1fr) auto}
.qrow.done .t{text-decoration:none;color:var(--muted);font-weight:500}
.bylaw{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:.68rem;font-weight:700;letter-spacing:.04em;background:var(--poppy-soft);color:var(--poppy);vertical-align:1px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:4px}
.allclear{display:flex;gap:12px;align-items:center;padding:14px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.preview{background:var(--accent-soft);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.preview .row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.preview .k{color:var(--muted)}
.sg.narrow{color:transparent}
.tl-axis span{font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .tl-axis .mid{display:none}
  .tl-axis{margin-left:0}
  .lane{grid-template-columns:minmax(0,1fr);gap:3px}
  .lane .ln{text-align:left}
  .seglist div{grid-template-columns:12px minmax(0,1fr)}
  .seglist div > span:last-child{grid-column:2;color:var(--muted)}
  .cal{min-width:0}
  .cal .lane{grid-template-columns:minmax(0,1fr)}
  .cal .tl-axis{margin-left:0}
  table.cards thead{display:none}
  table.cards, table.cards tbody{display:block}
  table.cards tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{display:block;border:0;padding:0;text-align:left}
  table.cards td.full{grid-column:1/-1}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
  .tw{margin:0;padding:0}
}
.lawlist{display:flex;flex-direction:column}
.lawlist > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.lawlist > div:first-child{border-top:0}
.lawlist .why{font-size:.84rem;color:var(--muted)}
/* Sign-in */
.login{grid-template-columns:minmax(0,360px) minmax(0,1fr)}
.welcome h1{font-size:2rem}
.accts{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.acct{flex-direction:row;align-items:center;gap:12px;padding:12px}
.acct > div{display:flex;flex-direction:column;gap:1px;min-width:0}
.acct b{font-size:.95rem}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.accts{grid-template-columns:repeat(2,minmax(0,1fr))}.acct{flex-direction:column;align-items:flex-start;gap:8px}.acct .scn{font-size:.78rem}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="3" height="12" rx="1" fill="var(--accent-ink)"/><rect x="6.5" y="5" width="3" height="9" rx="1" fill="var(--accent-ink)" opacity=".75"/><rect x="11" y="8" width="3" height="6" rx="1" fill="var(--accent-ink)" opacity=".5"/></svg></span>
      <div><b>Leave Ledger</b> <span class="envtag" hidden>Test</span><div class="co" id="coName"></div></div>
    </div>
    <div class="seg" id="views" role="group" aria-label="View"></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</header>
<div id="root"><div class="loading">Loading</div></div>
<div class="toast" id="toast" role="status" hidden></div>
<button class="fb-btn" id="fbBtn" type="button" hidden aria-expanded="false" aria-controls="fbPop">Feedback</button>
<section class="panel fb-pop" id="fbPop" hidden aria-label="Send feedback"></section>
<script type="module" src="/app.mjs"></script>
<script src="/build.js" defer></script>
</body>
</html>
