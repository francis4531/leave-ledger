<style>
/* Layout: same shell as the app; summary strip, six-week track, current module open, the rest folded. */
:root{
  color-scheme:light;
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#15202b; --muted:#5a6876; --line:#d9e0e7;
  --accent:#0d5d79; --accent-ink:#ffffff; --accent-soft:#e0edf2;
  --poppy:#d9581a; --poppy-soft:#fbe7dc;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#9a6510; --warn-soft:#fbefd6; --bad:#b83a27; --bad-soft:#f8e1dc;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunk:#1c2732; --ink:#e4eaf0; --muted:#97a5b3; --line:#2a3743;
  --accent:#5fb4d3; --accent-ink:#06202b; --accent-soft:#163240;
  --poppy:#f0884c; --poppy-soft:#3a2418;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e2b056; --warn-soft:#3a2d12; --bad:#f08470; --bad-soft:#3d1d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand{color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:800}
.brand > span > span{display:block;font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;font:inherit;font-weight:600;font-size:.88rem;text-decoration:none;cursor:pointer}
main.wrap{padding-block:26px 60px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:1.75rem;font-weight:800}
.hero p{color:var(--muted);margin:6px 0 0;max-width:68ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:.95rem;color:var(--muted);font-weight:600}
.sub{font-size:.84rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}

.wk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.wk:hover{border-color:var(--accent)}

.wk .n{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wk .t{font-family:var(--f-display);font-weight:700;font-size:1rem}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:1.15rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
details.mod{border-top:1px solid var(--line);padding-top:10px}
details.mod:first-of-type{border-top:0;padding-top:0}
details.mod > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0}

details.mod > summary h3{font-size:1.02rem}
details.mod > summary h3::before{content:"▸";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}

.md h1{font-size:1.2rem;margin:14px 0 6px}.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3{font-size:.98rem;margin:12px 0 4px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:1.3em}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md .tw{overflow-x:auto}
.md table{border-collapse:collapse;width:100%;font-size:.87rem;margin:8px 0}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{white-space:nowrap;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem}
.msg{max-width:520px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.dec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.dec:first-of-type{border-top:0;padding-top:0}
.dec-h{display:flex;align-items:flex-start;gap:10px}
.dec-h h3{font-size:1rem;flex:1;min-width:0}
.dec-h .num{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.dec .q{color:var(--muted);font-size:.92rem;margin-left:34px}
.dec .body{margin-left:34px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ans{background:var(--sunk);border-radius:6px;padding:10px 12px}
.ans .md p:first-child{margin-top:0}.ans .md p:last-child{margin-bottom:0}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:84px;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.86rem;cursor:pointer;background:var(--surface)}
.choices input{accent-color:var(--accent)}
.choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.link{border:0;background:none;color:var(--accent);padding:0}
.err{color:var(--bad);font-weight:600;font-size:.88rem}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.wtab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.wtab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.log-w{font-family:var(--f-display);font-weight:700;margin-top:6px}
.log-i{font-size:.9rem;padding:6px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>

<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="3" height="12" rx="1" fill="var(--accent-ink)"/><rect x="6.5" y="5" width="3" height="9" rx="1" fill="var(--accent-ink)" opacity=".75"/><rect x="11" y="8" width="3" height="6" rx="1" fill="var(--accent-ink)" opacity=".5"/></svg></span><span><b>Leave Ledger</b><span>Product strategy</span></span></a>
  <a class="btn" href="/">Back to the app</a>
</div></header>
<div id="root"><p class="msg">Loading</p></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const MODULES = [
  { n: 1, key: "The Bet", folder: "01-the-bet", q: "What we're building, for whom, why now" },
  { n: 2, key: "The Moat", folder: "02-the-moat", q: "Why this won't get copied in 6 months" },
  { n: 3, key: "The Margin", folder: "03-the-margin", q: "Will this make money or bleed it?" },
  { n: 4, key: "The Contract", folder: "04-the-contract", q: "Why users will trust a probabilistic system" },
  { n: 5, key: "The Guardrails", folder: "05-the-guardrails", q: "What breaks when this scales, and what compounds" },
  { n: 6, key: "The Pitch", folder: "06-the-pitch", q: "How this gets funded, shipped and adopted" },
];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => { const h = DOMPurify.sanitize(marked.parse(s || "")); return h.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>"); };
const ptToday = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const days = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const toISO = (s) => { const d = new Date(s + (/\d{4}/.test(s) ? "" : ", 2026")); return isNaN(d) ? null : new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())).toISOString().slice(0, 10); };

// Split README into "## Heading" sections.
function sections(text) {
  const out = {}; let cur = "_top", buf = [];
  for (const line of text.split("\n")) {
    const m = line.match(/^## (.+)$/);
    if (m) { out[cur] = buf.join("\n"); cur = m[1].trim(); buf = []; } else buf.push(line);
  }
  out[cur] = buf.join("\n");
  return out;
}
function statusOf(cell) {
  const done = /\[x\]/i.test(cell);
  const rest = cell.replace(/\[[x ]\]/i, "").trim();
  if (!done) return { t: "Not started", cls: "" };
  if (/final|done|complete/i.test(rest)) return { t: "Done", cls: "ok" };
  return { t: rest ? rest.split(",")[0] : "Drafted", cls: "acc", note: rest };
}

/* ---------- Weekly decisions ---------- */
const DEC = { week: 0, module: "", items: [], saved: [], canEdit: false, github: { on: false }, editing: {}, error: {} };
const STAT = { decided: ["Decided", "ok"], info: ["Need more info", "warn"], deferred: ["Deferred", ""], dropped: ["Not doing", ""] };
function parseDecisions(text) {
  const out = []; let cur = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^(\d+)\.\s+(.*)$/);
    if (m) {
      if (cur) out.push(cur);
      const rest = m[2];
      const t = rest.match(/^(?:~~)?\*\*(.+?)\*\*(?:~~)?\s*(.*)$/) || rest.match(/^~~(.+?)~~\s*(.*)$/);
      const title = (t ? t[1] : rest.split(/[.?]/)[0]).replace(/\.$/, "").replace(/~~/g, "").trim();
      cur = { n: +m[1], title, question: (t ? t[2] : rest).trim(), done: /^~~/.test(rest) };
    } else if (cur && line.trim()) cur.question += " " + line.trim();
  }
  if (cur) out.push(cur);
  return out;
}
const dkey = (w, n) => `w${w}-${n}`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "America/Los_Angeles" });
function selectWeek(w) { DEC.week = w; DEC.module = DEC.mods && DEC.mods[w - 1] ? DEC.mods[w - 1].key : ""; DEC.items = DEC.weeks[w] || []; }
function weekTabs() {
  const ws = Object.keys(DEC.weeks).map(Number).sort((a, b) => a - b);
  if (ws.length < 2) return "";
  const saved = new Set(DEC.saved.map((x) => x.key));
  return `<div class="wtabs" role="tablist">${ws.map((w) => { const its = DEC.weeks[w], done = its.filter((it) => saved.has(dkey(w, it.n))).length; return `<button role="tab" class="wtab ${w === DEC.week ? "on" : ""}" aria-selected="${w === DEC.week}" data-week="${w}">Week ${w}${w === DEC.current ? " · now" : ""}<span class="pill ${done === its.length && its.length ? "ok" : ""}">${done}/${its.length}</span></button>`; }).join("")}</div>`;
}
function renderDecisions() {
  const el = document.getElementById("decPanel"); if (!el) return;
  const byKey = Object.fromEntries(DEC.saved.map((x) => [x.key, x]));
  const answered = DEC.items.filter((it) => byKey[dkey(DEC.week, it.n)]).length;
  const gh = DEC.github || {};
  el.innerHTML = `${weekTabs()}<div class="head"><h2>${DEC.week === DEC.current ? "This week's decisions" : "Decisions"} · Week ${DEC.week}${DEC.module ? ` · ${esc(DEC.module)}` : ""}</h2><span class="pill ${answered === DEC.items.length && DEC.items.length ? "ok" : "acc"}">${answered} of ${DEC.items.length} answered</span></div>
    <p class="sub">${DEC.canEdit ? "Record each decision after your session. Answers are saved for everyone and feed next week's draft." : "Sign in as the HR admin account (Grace) to record decisions."} ${gh.on ? (gh.last && gh.last.error ? `<span class="err">Last copy to GitHub failed: ${esc(gh.last.error)}</span>` : "A copy goes to <code>strategy/decisions.md</code> on GitHub.") : "Saved on the site only. Add <code>LL_GITHUB_TOKEN</code> in Netlify to also keep a copy in the repo."}</p>
    ${DEC.items.length ? DEC.items.map((it) => {
      const k = dkey(DEC.week, it.n), sv = byKey[k], editing = DEC.editing[k] || (!sv && DEC.canEdit);
      const st = sv ? STAT[sv.status] : null;
      return `<div class="dec" id="d-${k}">
        <div class="dec-h"><span class="num">${it.n}</span><h3>${esc(it.title)}</h3>${st ? `<span class="pill ${st[1]}">${st[0]}</span>` : `<span class="pill">Open</span>`}</div>
        <div class="q md">${md(it.question)}</div>
        <div class="body">
          ${sv && !editing ? `<div class="ans"><div class="md">${md(sv.answer || "_No answer written._")}</div></div><div class="row sub">${st[0]} ${fmtDate(sv.at)} · ${esc(sv.by)}${sv.history && sv.history.length ? ` · changed ${sv.history.length} time${sv.history.length === 1 ? "" : "s"}` : ""}${DEC.canEdit ? ` <button class="btn link" data-edit="${k}">Change</button>` : ""}</div>` : ""}
          ${editing ? `<label class="sub" for="a-${k}">Your decision and why</label><textarea id="a-${k}" placeholder="For example: Tilt is the bigger threat. Our edge for a 15-person company is price and the notice clock. Test this in interviews.">${esc(sv ? sv.answer : "")}</textarea>
            <div class="choices" role="radiogroup" aria-label="Status">${Object.entries(STAT).map(([v, [lab]]) => `<label><input type="radio" name="s-${k}" value="${v}" ${(sv ? sv.status : "decided") === v ? "checked" : ""}>${lab}</label>`).join("")}</div>
            ${DEC.error[k] ? `<p class="err">${esc(DEC.error[k])}</p>` : ""}
            <div class="row"><button class="btn primary" data-save="${k}" data-n="${it.n}">Save</button>${sv ? `<button class="btn" data-cancel="${k}">Cancel</button>` : ""}</div>` : ""}
          ${!sv && !DEC.canEdit ? `<p class="sub">Not answered yet.</p>` : ""}
        </div></div>`;
    }).join("") : `<p class="empty">No open decisions listed for this week.</p>`}`;
  renderLog();
}
function renderLog() {
  const el = document.getElementById("logPanel"); if (!el) return;
  const weeks = [...new Set(DEC.saved.map((x) => x.week))].sort((a, b) => b - a);
  el.innerHTML = `<h2>Decision log</h2>${weeks.length ? weeks.map((w) => `<div class="log-w">Week ${w}${(DEC.saved.find((x) => x.week === w) || {}).module ? ` · ${esc(DEC.saved.find((x) => x.week === w).module)}` : ""}</div>${DEC.saved.filter((x) => x.week === w).sort((a, b) => a.n - b.n).map((x) => `<div class="log-i"><b>${x.n}. ${esc(x.title)}</b> <span class="pill ${STAT[x.status][1]}">${STAT[x.status][0]}</span><div class="sub">${esc((x.answer || "").length > 220 ? x.answer.slice(0, 220) + "…" : x.answer || "No answer written.")}</div></div>`).join("")}`).join("") : `<p class="empty">Decisions you save show up here, week by week.</p>`}`;
}
function toast(msg) { let t = document.getElementById("toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200); }
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.week) { selectWeek(+b.dataset.week); renderDecisions(); return; }
  if (b.dataset.edit) { DEC.editing[b.dataset.edit] = true; renderDecisions(); document.getElementById("a-" + b.dataset.edit)?.focus(); return; }
  if (b.dataset.cancel) { delete DEC.editing[b.dataset.cancel]; delete DEC.error[b.dataset.cancel]; renderDecisions(); return; }
  if (b.dataset.save) {
    const k = b.dataset.save, n = +b.dataset.n, it = DEC.items.find((x) => x.n === n);
    const answer = document.getElementById("a-" + k).value;
    const status = (document.querySelector(`input[name="s-${k}"]:checked`) || {}).value;
    b.disabled = true; b.textContent = "Saving";
    try {
      const r = await fetch("/api/strategy/decision", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ week: DEC.week, module: DEC.module, n, title: it.title, question: it.question, answer, status }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Could not save. Try again.");
      DEC.saved = j.decisions; DEC.github = { on: j.github.on, last: j.github }; delete DEC.editing[k]; delete DEC.error[k];
      renderDecisions();
      toast(j.github.on ? (j.github.ok ? "Saved, and copied to GitHub" : "Saved. The GitHub copy failed; see the note at the top.") : "Saved");
    } catch (e) { DEC.error[k] = e.message; renderDecisions(); }
  }
});

async function load() {
  const root = document.getElementById("root");
  let r;
  try { r = await fetch("/api/strategy", { credentials: "same-origin" }); } catch (e) { root.innerHTML = `<div class="msg"><h1>Can't reach the site</h1><p>Check your connection and reload.</p></div>`; return; }
  if (r.status === 401) { root.innerHTML = `<div class="msg"><h1>Sign in first</h1><p class="sub">The strategy is only visible to signed-in test users.</p><a class="btn" href="/">Go to sign in</a></div>`; return; }
  if (!r.ok) { root.innerHTML = `<div class="msg"><h1>Page not found</h1><a class="btn" href="/">Go to the app</a></div>`; return; }
  const data = await r.json();
  const F = data.files || {};
  const odKey = Object.keys(sections(F["README.md"] || "")).find((k) => k.startsWith("Open decisions"));
  const readme = F["README.md"] || "";
  const S = sections(readme);
  const top = S._top || "";
  const today = ptToday();

  // Status table
  const rows = (S["Strategy at a Glance"] || "").split("\n").filter((l) => /^\|\s*\*\*/.test(l)).map((l) => l.split("|").map((c) => c.trim()));
  const mods = MODULES.map((m, i) => {
    const row = rows.find((r) => r[1].includes(m.key)) || [];
    const weekOf = row[3] && /\w{3} \d/.test(row[3]) ? toISO(row[3]) : null;
    const secKey = Object.keys(S).find((k) => k.startsWith(m.key));
    const files = Object.keys(F).filter((p) => p.startsWith(m.folder + "/"));
    return { ...m, weekOf, weekLabel: row[3] || "", status: statusOf(row[4] || "[ ]"), summary: secKey ? S[secKey] : "", files };
  });
  const drafted = mods.filter((m) => m.status.t !== "Not started").length;
  let current = mods.findIndex((m, i) => m.weekOf && today >= m.weekOf && (!mods[i + 1] || !mods[i + 1].weekOf || today < mods[i + 1].weekOf));
  if (current < 0) current = today < (mods[0].weekOf || "") ? 0 : mods.length - 1;

  const num = (re) => { const m = top.match(re); return m ? [+m[1], +m[2]] : null; };
  const iv = num(/Customer interviews:\*\*\s*(\d+)\s*of\s*(\d+)/i);
  const pc = num(/Partner challenges done:\*\*\s*(\d+)\s*of\s*(\d+)/i);
  const killDate = (top.match(/check on ([A-Z][a-z]{2,8} \d{1,2}, \d{4})/) || [])[1];
  const killISO = killDate ? toISO(killDate) : null;
  const daysLeft = killISO ? days(today, killISO) : null;
  const conf = ((S[Object.keys(S).find((k) => k.startsWith("The Bet"))] || "").match(/\*\*Confidence:\*\*\s*([HML])\b/) || [])[1];
  const confName = { H: "High", M: "Medium", L: "Low" }[conf] || "Not set";
  const updated = (top.match(/Last updated:\*\*\s*(.+)/) || [])[1] || "";
  const pace = iv && daysLeft !== null && daysLeft > 0 ? Math.ceil((iv[1] - iv[0]) / Math.max(1, daysLeft / 7)) : null;

  const pane = (m, open) => `<details class="mod" id="m${m.n}" ${open ? "open" : ""}>
    <summary><h3>Week ${m.n} · ${esc(m.key)}</h3><span class="pill ${m.status.cls}">${esc(m.status.t)}</span></summary>
    <p class="sub" style="margin:2px 0 8px">${esc(m.q)}${m.weekLabel ? ` · week of ${esc(m.weekLabel)}` : ""}</p>
    ${m.status.t === "Not started" ? `<p class="empty">Drafted automatically the Sunday before the week of ${esc(m.weekLabel)}.</p>` : `<div class="md">${md(m.summary.replace(/^\s*\*\*.*?\*\*\s*\n/, "").replace(/→ Details:.*$/m, ""))}</div>
    ${m.files.map((p) => `<details class="file"><summary>${esc(p.split("/").pop())}</summary><div class="md">${md(F[p])}</div></details>`).join("")}`}
  </details>`;

  root.innerHTML = `<main class="wrap">
    <section class="hero"><h1>Strategy course progress</h1><p>Six weekly modules of the Product School AI product strategy template, applied to Leave Ledger. ${updated ? `Last updated ${esc(updated)}.` : ""}</p></section>
    <section class="stats">
      <div class="stat"><span class="label">Modules drafted</span><span class="big">${drafted} <small>of 6</small></span><div class="meter"><span style="width:${drafted / 6 * 100}%"></span></div><span class="sub">This week: ${esc(mods[current].key)}</span></div>
      <div class="stat"><span class="label">Customer interviews</span><span class="big">${iv ? iv[0] : "?"} <small>of ${iv ? iv[1] : 10}</small></span><div class="meter ${iv && pace > 3 ? "warn" : ""}"><span style="width:${iv ? Math.min(100, iv[0] / iv[1] * 100) : 0}%"></span></div><span class="sub">${pace ? `About ${pace} a week to finish on time` : iv && iv[0] >= iv[1] ? "Target reached" : "Target set in the README"}</span></div>
      <div class="stat"><span class="label">Kill criteria check</span><span class="big">${daysLeft !== null ? (daysLeft >= 0 ? daysLeft : 0) : "?"} <small>days</small></span><span class="sub">${killDate ? esc(killDate) : "No date set"}</span></div>
      <div class="stat"><span class="label">Confidence in the bet</span><span class="big">${esc(confName)}</span><span class="sub">${pc ? `${pc[0]} of ${pc[1]} partner challenges done` : ""}</span></div>
    </section>
    <section class="track" aria-label="Six weeks">${mods.map((m, i) => `<button class="wk ${i === current ? "now" : ""}" data-go="m${m.n}"><span class="n">Week ${m.n}${i === current ? " · now" : ""}</span><span class="t">${esc(m.key)}</span><span class="sub">${esc(m.weekLabel)}</span><span class="pill ${m.status.cls}">${esc(m.status.t)}</span></button>`).join("")}</section>
    <section class="panel" id="decPanel"></section>
    <div class="grid">
      <section class="panel"><div class="head"><h2>Modules</h2><span class="sub">Tap a week to open it</span></div>${mods.map((m, i) => pane(m, i === current)).join("")}</section>
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
        <section class="panel" id="logPanel"></section>
        <section class="panel"><h2>Changelog</h2><div class="md">${md(S["Changelog"] || "_Nothing yet._")}</div></section>
      </div>
    </div>
    <p class="foot">Read from the strategy folder in GitHub each time the site deploys${data.builtAt ? `, last on ${new Date(data.builtAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" })}` : ""}. Visible only to signed-in test users.</p>
  </main>`;
  // Every week's questions: strategy/questions.md, plus this week's from the README if missing there.
  DEC.weeks = {};
  const QS = sections(F["questions.md"] || "");
  Object.keys(QS).forEach((k) => { const m = k.match(/^Week (\d+)/); if (m) DEC.weeks[+m[1]] = parseDecisions(QS[k]); });
  const curWeek = +((odKey || "").match(/Week (\d+)/) || [])[1] || (current + 1);
  if (!DEC.weeks[curWeek] && odKey) DEC.weeks[curWeek] = parseDecisions(S[odKey] || "");
  DEC.mods = mods; DEC.current = curWeek;
  selectWeek(DEC.week && DEC.weeks[DEC.week] ? DEC.week : curWeek);
  DEC.saved = data.decisions || []; DEC.canEdit = !!data.canEdit; DEC.github = data.github || { on: false };
  renderDecisions();
  root.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { const d = document.getElementById(b.dataset.go); d.open = true; d.scrollIntoView({ behavior: "smooth", block: "start" }); }));
}
load();
</script>
</body>
</html>
