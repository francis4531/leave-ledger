[build]
  publish = "public"
  command = "node scripts/build-strategy.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[redirects]]
  from = "/strategy"
  to = "/strategy.html"
  status = 200

[[redirects]]
  from = "/inbox"
  to = "/inbox.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
